<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Viewer - 8-bit Art Maker</title>
  <script src="src/core/theme/theme.js"></script>
  <link rel="stylesheet" href="src/core/theme/theme.css">
  <link rel="stylesheet" href="src/core/layout/shell.css">
  <link rel="stylesheet" href="src/features/viewer/viewer.css">
  <link rel="stylesheet" href="src/features/compare/compare.css">
  <link rel="stylesheet" href="src/features/zoom-modal/zoom-modal.css">
</head>
<body>
  <div class="app">
    <header class="app-bar">
      <a class="btn btn--text" href="index.html">New image</a>
      <h1>Viewer</h1>
      <a class="btn btn--text" href="settings.html">Settings</a>
    </header>
    <main class="main">
      <div class="viewport">
        <div class="stage" id="stage" data-view="art">
          <img class="stage__img stage__img--original" id="original" alt="Original image" draggable="false">
          <img class="stage__img stage__img--art" id="art" alt="Pixel art version" draggable="false">
          <div class="compare" id="compare" role="slider" tabindex="0" aria-label="Comparison position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" hidden>
            <span class="compare__tag compare__tag--left">Original</span>
            <span class="compare__tag compare__tag--right" id="art-tag"></span>
            <span class="compare__grip"></span>
          </div>
        </div>
        <button class="btn btn--tonal viewport__action viewport__dither" id="dither" type="button" aria-pressed="false">Dither</button>
        <button class="btn btn--tonal viewport__action viewport__zoom" id="zoom" type="button">Zoom</button>
      </div>
      <div class="segmented" id="view" aria-label="View"></div>
      <div class="segmented segmented--grid" id="levels" aria-label="Bit level"></div>
      <button class="btn btn--filled btn--fab btn--block" id="export" type="button">Export PNG</button>
      <p class="note" id="note" role="status"></p>
    </main>
  </div>
  <script type="module" src="src/features/viewer/viewer-page.js"></script>
</body>
</html>
